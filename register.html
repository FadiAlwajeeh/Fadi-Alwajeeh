<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل</title>
    <!-- رابط Bootstrap محلي -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Arial', sans-serif;
        }
        
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .social-btns {
            display: flex;
            justify-content: space-between;
        }
        
        .social-btns .btn {
            flex: 1;
            margin: 0 5px;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>التسجيل</h2>
        <form id="register-form">
            <div class="mb-3">
                <label for="username" class="form-label">اسم المستخدم</label>
                <input type="text" id="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">البريد الإلكتروني</label>
                <input type="email" id="email" class="form-control" placeholder="أدخل بريدك الإلكتروني" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">رقم الهاتف</label>
                <input type="tel" id="phone" class="form-control" placeholder="أدخل رقم هاتفك" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">كلمة المرور</label>
                <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" required>
            </div>
            <div class="mb-3">
                <label for="confirm-password" class="form-label">تأكيد كلمة المرور</label>
                <input type="password" id="confirm-password" class="form-control" placeholder="أعد إدخال كلمة المرور" required>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" id="privacy-policy" class="form-check-input" required>
                <label for="privacy-policy" class="form-check-label">أوافق على <a href="#">سياسة الخصوصية والأمان</a></label>
            </div>
            <button type="submit" class="btn btn-primary w-100">تسجيل</button>
            <div class="mt-3 text-center">أو</div>
            <div class="social-btns mt-3">
                <button type="button" class="btn btn-primary">التسجيل عبر فيسبوك</button>
                <button type="button" class="btn btn-danger">التسجيل عبر جوجل</button>
            </div>
        </form>
    </div>
    <!-- رابط Bootstrap محلي -->
    <script src="js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert('كلمات المرور غير متطابقة');
            } else {
                alert('تم التسجيل بنجاح!');
                e.target.reset();
            }
        });
    </script>
</body>

</html>
