<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة عقار</title>
    <!-- رابط Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- رابط Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href='style1.css'>
    <link rel="stylesheet" href='add_prop.css'>
    <link rel="stylesheet " href='css/bootstrap.css'>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="scripts.js" defer></script>

</head>

<body>
    <div class="form-container animate__animated animate__fadeIn ">
        <h2 class="add_text">إضافة عقار جديد</h2>
        <form id="property-form">
            <div class="mb-3">
                <label for="property-name" class="form-label">اسم العقار</label>
                <input type="text" id="property-name" class="form-control animated-input" placeholder="أدخل اسم العقار" required>
            </div>
            <div class="mb-3">
                <label for="property-type" class="form-label">نوع العقار</label>
                <select id="property-type" class="form-select animated-input" required>
                    <option value="" disabled selected>اختر نوع العقار</option>
                    <option value="building">مبنى</option>
                    <option value="apartment">شقة</option>
                    <option value="land">أرض</option>
                    <option value="room">غرفة</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="property-category" class="form-label">القسم</label>
                <select id="property-category" class="form-select animated-input" required>
                    <option value="" disabled selected>اختر القسم</option>
                    <option value="rent">إيجار</option>
                    <option value="sale">بيع</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="property-image" class="form-label">صورة العقار</label>
                <input type="file" id="property-image" class="form-control animated-input" accept="image/*" required>
            </div>
            <div class="mb-3">
                <label for="property-details" class="form-label">تفاصيل العقار</label>
                <textarea id="property-details" class="form-control animated-input" rows="4" placeholder="أدخل تفاصيل العقار" required></textarea>
            </div>
            <div class="mb-3">
                <label for="property-price" class="form-label">سعر العقار</label>
                <input type="number" id="property-price" class="form-control animated-input" placeholder="أدخل سعر العقار" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">إضافة العقار</button>
        </form>
        <div></div>
        <a href="home2.html " class="btn btn-outline-primary text-center m-4 ">العودة الى الصفحة الرئيسية-></a>
    </div>

    <!-- مكتبة Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- JavaScript -->
    <script src="add_prop.js"></script>
</body>

</html>
